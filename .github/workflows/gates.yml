# Nova's phase gates, as CI.
#
# The blueprint calls for breach evals to be merge-blocking (§16.4): one
# authority breach should fail the build, not be noticed in review. Until this
# existed, `npm test` was a gate only if someone remembered to run it.
#
# Everything here is hermetic — no database, no model calls, no network. The
# suites use the in-memory demo backend and deterministic fixtures, so this is
# fast and cannot flake on an external service.
name: gates

# `feat/front-office` is on both lists because Stage 10 is built there and
# merges to `develop` only at the end of the stage. Until module 03 added it,
# neither trigger matched the branch every Front Office commit lands on, so
# every "CI hard gate" those module specs promised was vacuous — the workflow
# had never executed for any of this work. A gate that does not run is a
# comment.
#
# Read the first run on this branch honestly: `npm test` is a single `&&`
# chain, and it is RED at its 4th step — the isolation suite's founder-context
# ceiling (3085 > 2500 tok, a known pre-existing failure, F-20 in
# docs/HUMAN-VERIFICATION-REQUIRED.md). So adding the branch here makes the
# workflow RUN and REPORT that, which is the point; it does not make Stage 10's
# own suites gate anything yet, because the chain stops before reaching them.
# Until F-20 is resolved, the Front Office suites are proved by running them
# individually against their recorded baselines. Do not "fix" this by reordering
# the chain to put a green suite in front of the red one.
on:
  push:
    branches: [main, develop, feat/front-office]
  pull_request:
    branches: [main, develop, feat/front-office]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck, the §16.3 completeness checks (every undoable verb has an
      # engineered inverse; dakio-api's duty mirror is current), then the
      # suites — isolation, memory, jobs, spine, duties, and the authority
      # breach corpus.
      - name: Phase gates
        run: npm test

      # A build failure is a gate failure: the agent has to actually compile
      # and register its tools, not merely typecheck.
      - name: eve build
        run: npx eve build

      - name: eve diagnostics must be clean
        run: |
          npx eve info > eve-info.txt
          cat eve-info.txt
          if ! grep -qE 'Diagnostics +0 errors, 0 warnings' eve-info.txt; then
            echo "::error::eve reported diagnostics — see the output above"
            exit 1
          fi
